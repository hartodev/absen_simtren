# ============================================================
# Nginx vhost untuk absen_simtren — Laravel multi-tenant wildcard
# Domain utama: ptutamacta.com
# Wildcard    : *.ptutamacta.com
#
# File ini SATU vhost yang menangani domain utama + semua subdomain
# tenant sekaligus, karena Laravel sendiri yang membedakan lewat
# middleware DetectTenant (bukan dari Nginx).
#
# Cara pakai:
#   sudo cp nginx-absen-simtren.conf /etc/nginx/sites-available/absen-simtren
#   sudo ln -s /etc/nginx/sites-available/absen-simtren /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # server_name utama + wildcard subdomain
    server_name ptutamacta.com *.ptutamacta.com;

    root /var/www/absen-simtren/public;
    index index.php index.html;

    # Ukuran upload maksimal (naikkan kalau nanti ada upload logo, dsb)
    client_max_body_size 20M;

    access_log /var/log/nginx/absen-simtren.access.log;
    error_log  /var/log/nginx/absen-simtren.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Sesuaikan versi PHP-FPM socket-nya
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Karena Cloudflare Tunnel jalan lokal di server yang sama (127.0.0.1),
    # Nginx cukup dengar di 80/localhost saja -- TIDAK perlu expose port 80/443
    # ke internet publik langsung kalau semua trafik lewat tunnel.
}
